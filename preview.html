<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReviewScope AI - First Preview</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Microsoft YaHei", sans-serif; }
    body { margin: 0; background: #f5f7fb; color: #18212f; }
    main { max-width: 1180px; margin: 0 auto; padding: 40px 24px 64px; }
    h1 { margin: 0; font-size: 36px; }
    .subtitle { color: #667085; margin: 8px 0 28px; }
    .goal, .card, .panel { background: white; border: 1px solid #e4e7ec; border-radius: 16px; box-shadow: 0 8px 24px rgba(16,24,40,.05); }
    .goal { padding: 18px 22px; border-left: 5px solid #635bff; }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 20px 0; }
    .card { padding: 18px; }
    .label { color: #667085; font-size: 14px; }
    .value { font-size: 30px; font-weight: 700; margin-top: 8px; }
    .panel { padding: 24px; margin-top: 20px; overflow: auto; }
    .bars { display: flex; align-items: end; gap: 18px; height: 180px; padding-top: 20px; }
    .bar-wrap { flex: 1; text-align: center; color: #667085; }
    .bar { min-height: 4px; background: linear-gradient(180deg, #7770ff, #5148e5); border-radius: 8px 8px 3px 3px; margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th, td { text-align: left; padding: 13px; border-bottom: 1px solid #eaecf0; vertical-align: top; }
    th { color: #475467; background: #f9fafb; }
    .status { display: grid; gap: 10px; }
    .done { color: #067647; background: #ecfdf3; padding: 12px; border-radius: 10px; }
    .later { color: #344054; background: #f2f4f7; padding: 12px; border-radius: 10px; }
    @media (max-width: 760px) { .metrics { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
<main>
  <h1>🔎 ReviewScope AI</h1>
  <p class="subtitle">把真实用户评论转化为可执行产品改进方案</p>
  <section class="goal"><strong>本次目标</strong><br>了解用户最主要的不满，并找出优先改进方向</section>
  <section class="metrics">
    <article class="card"><div class="label">原始评论</div><div class="value" id="raw">-</div></article>
    <article class="card"><div class="label">有效评论</div><div class="value" id="valid">-</div></article>
    <article class="card"><div class="label">清洗移除</div><div class="value" id="removed">-</div></article>
    <article class="card"><div class="label">平均评分</div><div class="value" id="average">-</div></article>
  </section>
  <section class="panel">
    <h2>评分分布</h2>
    <div class="bars" id="bars"></div>
  </section>
  <section class="panel">
    <h2>清洗后的评论</h2>
    <table>
      <thead><tr><th>ID</th><th>评分</th><th>标题</th><th>评论内容</th><th>版本</th></tr></thead>
      <tbody id="reviews"></tbody>
    </table>
  </section>
  <section class="panel status">
    <h2>当前工作流程</h2>
    <div class="done">✅ 读取示例数据</div>
    <div class="done">✅ 检查必要字段</div>
    <div class="done">✅ 过滤空评论、异常评分和重复评论</div>
    <div class="later">⏳ AI 动态主题发现（下一阶段）</div>
    <div class="later">⏳ 问题、PRD 和测试用例（后续阶段）</div>
  </section>
</main>
<script>
  fetch("data/sample_reviews.json")
    .then(response => response.json())
    .then(raw => {
      const seenIds = new Set();
      const seenContent = new Set();
      const cleaned = raw.filter(review => {
        const content = String(review.content || "").trim();
        const rating = Number(review.rating);
        if (!content || rating < 1 || rating > 5) return false;
        if (seenIds.has(review.review_id) || seenContent.has(content)) return false;
        seenIds.add(review.review_id);
        seenContent.add(content);
        return true;
      });
      document.querySelector("#raw").textContent = raw.length;
      document.querySelector("#valid").textContent = cleaned.length;
      document.querySelector("#removed").textContent = raw.length - cleaned.length;
      const average = cleaned.reduce((sum, row) => sum + Number(row.rating), 0) / cleaned.length;
      document.querySelector("#average").textContent = average.toFixed(1);
      const counts = [1, 2, 3, 4, 5].map(rating => cleaned.filter(row => Number(row.rating) === rating).length);
      const max = Math.max(...counts, 1);
      document.querySelector("#bars").innerHTML = counts.map((count, index) => `
        <div class="bar-wrap"><strong>${count}</strong><div class="bar" style="height:${Math.max(4, count / max * 130)}px"></div>${index + 1} 星</div>
      `).join("");
      document.querySelector("#reviews").innerHTML = cleaned.map(row => `
        <tr><td>${row.review_id}</td><td>${row.rating}</td><td>${row.title || ""}</td><td>${row.content}</td><td>${row.version || ""}</td></tr>
      `).join("");
    })
    .catch(error => document.body.insertAdjacentHTML("beforeend", `<p>加载示例数据失败：${error}</p>`));
</script>
</body>
</html>
